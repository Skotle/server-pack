# ===================================================================
# Zombie Apocalypse 999 - 지옥 난이도 설정
# ===================================================================

# -------------------
# 기본 좀비 능력치
# -------------------
zombie_stats:
  base_speed: 0.23          # 기본 이동속도 (0.23이 기본값 → 더 빠르게)
  base_damage: 2.0          # 기본 공격력 상승
  max_speed: 0.3            # 최대 속도 (플레이어 질주보다 훨씬 빠름)
  max_damage: 4.5         # 최대 공격력 (한 방에 플레이어 삭제 가능)

# -------------------
# 변이 확률
# -------------------
mutation_rates:
  base: 50.0                # 기본 변이 확률 50%
  daily_increase: 5.0       # 매일 +5%씩 증가 (며칠 지나면 100%)

# -------------------
# 스폰 규칙
# -------------------
# -------------------
# 스폰 규칙
# -------------------
zombies:
  spawn_time_mode: both            # 낮/밤 상관없이 항상 스폰
  require_darkness: true           # 밝으면 스폰 금지
  max_light_level: 7               # 최대 밝기 7까지 스폰
  max_per_chunk: 4               # 청크당 최대 좀비 (지옥 난이도 유지 + 서버 부담 완화)
  max_worldwide: 100              # 월드 전체 최대
  bloodmoon_ignores_darkness: true # 블러드문 때는 밝기 무시하고 스폰
  bloodmoon_enabled: true          # 블러드문 활성화

# -------------------
# 변이 시스템
# -------------------
mutation_system:
  show_mutation_names_above_zombies: true  # 좀비 머리 위에 변이 이름 표시

# ===================================================================
# 변이 타입 설정
# ===================================================================
mutation_types:
  tank:
    spawn_chance: 10.0
    health_multiplier: 5.0      # 체력 5배
    speed_multiplier: 0.6
    damage_multiplier: 2.0
  charger:
    spawn_chance: 5.0
    health_multiplier: 1.0
    speed_multiplier: 2.0       # 미친 속도로 돌진
    damage_bonus: 3.0
  assassin:
    spawn_chance: 10.0
    base_health: 4.0           # 낮은 체력 대신 데미지는 높음
    damage_multiplier: 3.0
  blight:
    spawn_chance: 15.0          # 맞으면 독 걸림
  burster:
    spawn_chance: 15.0          # 죽으면 폭발
  spitter:
    spawn_chance: 15.0          # 침 발사
  frost:
    spawn_chance: 10.0          # 슬로우 부여
  shrieker:
    spawn_chance: 10.0          # 소리 질러 주변 좀비 호출
  cryo:
    spawn_chance: 10.0
    flash_freeze_chance: 40.0   # 피격 시 얼리는 확률 증가
    frozen_trail_duration: 8
    shatter_damage: 7.0        # 사망 시 폭발적 피해
  inferno:
    spawn_chance: 10.0
    fireball_cooldown: 3        # 화염구 더 자주 발사
    scorched_earth_duration: 8
    meltdown_enabled: true      # 죽으면 용암 생성
  leech:
    spawn_chance: 10.0
    health_multiplier: 2.0
    damage_multiplier: 1.0
    leech_aura_damage: 2.0
    leech_aura_radius: 7.0
    leech_on_hit_heal_multiplier: 1.0
    death_heal_amount: 20.0
    death_heal_radius: 10.0

# ===================================================================
# 드롭 아이템 설정
# ===================================================================
loot_drops:
  tank:
    enabled: true
    items:
      - IRON_INGOT
      - SHIELD
  charger:
    enabled: true
    items:
      - GOLD_INGOT
  assassin:
    enabled: true
    items:
      - ENDER_PEARL
  blight:
    enabled: false
    items: []
  burster:
    enabled: false
    items: []
  spitter:
    enabled: false
    items: []
  frost:
    enabled: false
    items: []
  shrieker:
    enabled: true
    items:
      - ECHO_SHARD
  cryo:
    enabled: true
    items:
      - ICE
      - PACKED_ICE
      - SNOWBALL
  inferno:
    enabled: true
    items:
      - BLAZE_POWDER
      - MAGMA_CREAM
  leech:
    enabled: true
    items:
      - GHAST_TEAR

# ===================================================================
# 고급 AI 설정
# ===================================================================
ai:
  memory_duration: 5000     # 플레이어를 기억하는 시간 증가 (10초)

  noise:
    sprint_range: 40         # 달리면 40블록 거리에서 들림
    eating_range: 15         # 음식 먹어도 소리 감지
    bow_range: 20            # 활소리 감지 거리
    torch_range: 40          # 횃불 설치만 해도 몰려옴

  group:
    leader_chance: 0.2       # 절반 확률로 리더 생성
    radius: 30               # 리더가 발견하면 30블록 주변 좀비가 몰려옴
    follow_radius: 9        # 좀비 무리 생성

  breaking:
    enabled: true            # 블록 파괴 활성화
    radius: 3                # 4블록까지 파괴하며 접근
    default_cooldown_ticks: 100  # 1초마다 블록 부숨

    blocks:
      OAK_DOOR:
        cooldown_ticks: 15
      ACACIA_DOOR:
        cooldown_ticks: 15
      SPRUCE_DOOR:
        cooldown_ticks: 15
      BIRCH_DOOR:
        cooldown_ticks: 15
      JUNGLE_DOOR:
        cooldown_ticks: 15
      DARK_OAK_DOOR:
        cooldown_ticks: 15
      CRIMSON_DOOR:
        cooldown_ticks: 15
      WARPED_DOOR:
        cooldown_ticks: 15
      TRAPPED_CHEST:
        cooldown_ticks: 20
      CHEST:
        cooldown_ticks: 20
      OAK_FENCE:
        cooldown_ticks: 10
      SPRUCE_FENCE:
        cooldown_ticks: 10
      BIRCH_FENCE:
        cooldown_ticks: 10
      JUNGLE_FENCE:
        cooldown_ticks: 10
      DARK_OAK_FENCE:
        cooldown_ticks: 10
      ACACIA_FENCE:
        cooldown_ticks: 10

# ===================================================================
# 감염 시스템
# ===================================================================
infection_system:
  enabled: false
  chance_on_hit: 20.0                 # 맞으면 20% 확률로 감염 증가
  infection_increase: 20.0            # 맞을 때마다 감염도 20% 상승
  max_infection: 100.0
  show_infection_bar: true

  allow_golden_apple_cure: true
  golden_apple_cure_percent: 10.0     # 황금사과 치료량 감소
  enchanted_golden_apple_cure_percent: 25.0 # 갓사과도 치료량 약화

# ===================================================================
# 내부 데이터 (건들지 말기)
# ===================================================================
data:
  current_day: 0
